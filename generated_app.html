<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Angular Products App</title>
    <link rel="stylesheet" href="generated_app.css">
</head>
<body>
    <div class="products-container">
        <h1>Product Catalog</h1>
        
        <div class="filters">
            <input type="text" id="searchTerm" placeholder="Search products...">
            <select id="selectedCategory">
                <option value="">All Categories</option>
                <option value="electronics">Electronics</option>
                <option value="clothing">Clothing</option>
                <option value="books">Books</option>
            </select>
        </div>
        
        <div class="product-grid" id="productGrid">
            <!-- Products will be generated by JavaScript -->
        </div>
        
        <div id="noProducts" class="no-products" style="display: none;">
            No products found matching your criteria.
        </div>
        
        <div class="cart-summary">
            <h3>Cart Summary</h3>
            <p>Items in cart: <span id="cartCount">0</span></p>
            <p>Total: $<span id="cartTotal">0.00</span></p>
        </div>
    </div>
    
    <script src="generated_app.js"></script>
</body>
</html>
